# Conditional single-factor run (a), specs/002 tasks.md T053: identical to configs/inference.yaml
# except the repetition settings. repetition_penalty 1.3 penalises every token already in the
# sequence -- prompt included -- so a classification label that must be copied from the
# instruction, or a corrected sentence that must copy most of the input, is penalised; the
# T045 smoke run showed the response-only adapter emitting EOS as its first token under 1.3.
# Compared against inference.yaml on data/dev/dev_prompts.jsonl only (never on the frozen set).

max_new_tokens: 256
do_sample: false
temperature: 1.0
top_p: 1.0
repetition_penalty: 1.1
no_repeat_ngram_size: 0
