# Generation defaults for evaluation (src/evaluate.py) and benchmarking (src/benchmark.py).
# Deterministic (do_sample: false) so the same prompt produces the same output across
# repeated benchmark runs and across the base/instruct/official-instruct comparison.
#
# repetition_penalty 1.1 / no_repeat_ngram_size 0 are the settings the adopted model was
# evaluated with (specs/002 FR-021 run 3, eval/results/adoption-decision.md): the previous
# 1.3 / 3 -- introduced for the untuned base model, which collapsed into repeated-token runs --
# penalises every token already present in the prompt, so classification labels and sentences
# to be corrected (which must be copied) were being paraphrased away, and the response-only
# adapter sometimes emitted EOS as its first token. On the frozen set this change alone took
# qlora-v3b from a group-A fully-correct rate of 0.188 to 0.300 (grammar 0.031 -> 0.375).
# What gets published is what was evaluated: quantization/benchmark/model-card snippets use these.
# The 1.3 / 3 values remain in git history (and in the 001 result files' manifests) for the
# baseline/qlora-v1/qlora-v2/official runs.

max_new_tokens: 256
do_sample: false
temperature: 1.0     # ignored when do_sample is false; kept explicit for when sampled runs are needed
top_p: 1.0
repetition_penalty: 1.1
no_repeat_ngram_size: 0
